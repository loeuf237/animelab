name: 🧩 Test d'extension Aniyomi / Extension Compatibility Report
description: Partager le résultat d'un test d'extension APK ou de source intégrée / Report extension test results
title: "[Extension]: "
labels: ["extensions", "testing"]
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire est un **résumé d'intake**, pas le compte rendu détaillé.
        This form is an intake summary, not the detailed test record.
        Remplissez et joignez le
        [modèle Markdown](https://github.com/loeuf237/animelab/blob/main/docs/studies/aniyomi-anikku/RAPPORT_COMPATIBILITE_APK.md)
        (`passed` / `failed` / `blocked` / `not-tested`, preuve par étape).
        L'[exemple synthétique](https://github.com/loeuf237/animelab/blob/main/docs/studies/aniyomi-anikku/RAPPORT_COMPATIBILITE_APK_EXEMPLE.md)
        montre un blocage sans le compter comme un succès.
        Ne créez pas un second formulaire. Retirez numéros de série, cookies,
        jetons et URL signées : ces données ne sont pas demandées.
  - type: dropdown
    id: runtime
    attributes:
      label: Environnement / Runtime
      options:
        - Android — Moteur APK natif
        - Desktop / Serveur — Recette importée
        - Source intégrée (French-Manga, VoirAnime, AnimePahe)
    validations:
      required: true
  - type: input
    id: extension_name
    attributes:
      label: Nom et version de l'extension / Extension name & version
      placeholder: "ex. Aniyomi: Anime-Sama v14.33 / Voiranime v14.3"
    validations:
      required: true
  - type: checkboxes
    id: stages
    attributes:
      label: Étapes validées / Working stages
      options:
        - label: Recherche / Catalogue (Search & Catalog)
        - label: Fiche série & liste d'épisodes (Series details & Episode list)
        - label: Résolution des lecteurs vidéo (Video extractor resolution)
        - label: Lecture en streaming (Streaming playback)
        - label: Téléchargement complet d'un épisode (Full episode download)
        - label: Vérification WebView / Cloudflare (WebView verification resume)
  - type: textarea
    id: details
    attributes:
      label: Détails, appareil et erreurs observées / Device details & observed errors
      placeholder: "Résumé seulement : modèle ou OS, anime/épisode et message. Joignez le rapport Markdown. Pas de cookie, jeton, URL signée ni numéro de série."
