name: Release desktop Python + Vue

on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing release tag
        required: true
        default: v0.1.2

permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.label }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            label: Windows-x64
          - runner: ubuntu-22.04
            label: Linux-x64
          - runner: macos-15
            label: macOS-arm64
          - runner: macos-15-intel
            label: macOS-x64
    runs-on: ${{ matrix.runner }}
    env:
      PLATFORM_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test Vue
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-desktop.txt
      - name: Linux system libraries and media tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libgirepository1.0-dev libcairo2-dev pkg-config gir1.2-gtk-3.0 gir1.2-webkit2-4.1
      - name: macOS media tools
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Windows media tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --version=7.1.1 --yes --no-progress
          $ffmpeg = (Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $ffprobe = (Get-ChildItem C:\ProgramData\chocolatey\lib\ffmpeg -Recurse -Filter ffprobe.exe | Select-Object -First 1).FullName
          if (!$ffmpeg -or !$ffprobe) { throw "FFmpeg package is incomplete" }
          "ANIMAN_FFMPEG_BINARY=$ffmpeg" >> $env:GITHUB_ENV
          "ANIMAN_FFPROBE_BINARY=$ffprobe" >> $env:GITHUB_ENV
      - name: Install pinned desktop dependencies
        run: python -m pip install -r requirements-desktop.txt
      - name: Record versions and tool licenses
        run: python scripts/desktop_release.py prepare
      - name: Build Python app including Vue and media tools
        run: python -m PyInstaller --clean --noconfirm animan.spec
      - name: Test packaged backend, SPA, curl transport and media tools
        run: python scripts/desktop_release.py check
      - name: Archive checked platform package
        run: python scripts/desktop_release.py archive
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.label }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish complete desktop release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets
          merge-multiple: true
      - name: Require all platforms and calculate checksums
        run: python scripts/desktop_release.py checksums release-assets
      - name: Publish platform archives and manifests together
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: AnimeLab ${{ env.RELEASE_TAG }} — Python + Vue (macOS UNTESTED)
          body_path: docs/releases/${{ env.RELEASE_TAG }}.md
          files: release-assets/*
          fail_on_unmatched_files: true
          make_latest: true
          draft: false
          prerelease: false
