name: Android extension APK runtime

on:
  push:
    paths:
      - 'android/**'
      - 'animelab/services/*extension*'
      - 'animelab/services/android_extension*'
      - '.github/workflows/android-extensions.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'animelab/services/*extension*'
      - 'animelab/services/android_extension*'
      - '.github/workflows/android-extensions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-extensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compile:
    name: Compile original APK host API
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile extension runtime and public ABI
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :extension-runtime:assembleDebug :extension-probe:assembleDebug :extension-probe:assembleDebugAndroidTest --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: extension-host-api
          path: |
            android/extension-runtime/build/outputs/aar/*.aar
            android/extension-probe/build/outputs/apk/**/*.apk
          retention-days: 7

  emulator:
    name: Original APK execution Android ${{ matrix.api }}
    needs: runtime-compile
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: extension-host-api
          path: artifacts
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install -r artifacts/extension-probe/build/outputs/apk/debug/extension-probe-debug.apk
            adb install -r artifacts/extension-probe/build/outputs/apk/androidTest/debug/extension-probe-debug-androidTest.apk
            adb shell am instrument -w -r com.animan.extensions.probe.test/androidx.test.runner.AndroidJUnitRunner | tee instrumentation.txt
            adb logcat -d -s ANIMELAB_APK_PROOF:I > proof.txt
            grep -q 'OK (' instrumentation.txt
            grep -q 'executesComputedCode' proof.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-apk-android-${{ matrix.api }}-proof
          path: |
            instrumentation.txt
            proof.txt
          retention-days: 7
