name: Android extension APK runtime

on:
  push:
    paths:
      - 'android/**'
      - 'animelab/services/*extension*'
      - 'animelab/services/android_extension*'
      - '.github/workflows/android-extensions.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'animelab/services/*extension*'
      - 'animelab/services/android_extension*'
      - '.github/workflows/android-extensions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-extensions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runtime-compile:
    name: Compile original APK host API
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile extension runtime and public ABI
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :extension-runtime:assembleDebug --no-daemon --max-workers=2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: extension-host-api
          path: android/extension-runtime/build/outputs/aar/*.aar
          retention-days: 7
