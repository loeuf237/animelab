name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-launcher:
    name: Windows desktop launcher and native window
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      ANIMAN_STARTUP_REFRESH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --locked --group desktop
      - name: Test desktop administration and launch regressions
        run: uv run --locked --group desktop python -m pytest tests/test_desktop_admin.py tests/test_native_launcher.py tests/test_launcher_auth.py tests/test_release_tools.py -q
      - name: Render all native launcher tabs
        run: uv run --locked --group desktop python scripts/desktop_release.py launcher-check --source
      - name: Render and close a native Edge WebView2 window
        run: uv run --locked --group desktop --with pywebview==6.2.1 python scripts/desktop_release.py gui-check --source
      - name: Preserve native window failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-launcher-checks
          path: |
            build/native-window-check.log
            build/native-launcher-check.log
          if-no-files-found: ignore
          retention-days: 7

  python-quality:
    name: Python quality
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          enable-cache: true
      - run: uv sync --locked
      - name: Check locked runtime requirements export
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt uv.lock
      - run: uv run --locked python -m ruff check .
      - run: uv run --locked python -m mypy

  docker:
    name: Docker server build and persistence
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: animelab:local
          cache-from: type=gha,scope=animelab-server
          cache-to: type=gha,mode=max,scope=animelab-server
      - name: Validate Compose and test the actual server with temporary storage
        run: |
          docker compose config --quiet
          ANIMELAB_PUBLIC_URL=https://anime.example.org docker compose -f compose.yaml -f compose.shared.yaml config --quiet
          python3 scripts/docker_smoke.py

  frontend:
    name: Interface tests and build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Install browser for responsive UI tests
        run: npx playwright install --with-deps chromium
      - name: Test mobile and desktop layouts
        run: npm run test:ui
      - name: Save UI captures and browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: animelab-ui-validation
          path: |
            artifacts/mobile-ui/
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: animelab-frontend
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  python:
    name: Python ${{ matrix.python }} tests
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      ANIMAN_STARTUP_REFRESH: 'false'
      ANIMAN_HOST: '127.0.0.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: animelab-frontend
          path: frontend/dist/
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.1'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install media and binary inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg llvm
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Test backend and packaging tools with isolated storage
        run: uv run --locked python scripts/check.py python --junitxml=test-results/python.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.python }}-results
          path: test-results/python.xml
          if-no-files-found: warn
          retention-days: 7

  android-resources:
    name: Android manifest and launcher resources
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android resources without signing or building native wheels
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:processDebugResources --no-daemon --max-workers=2
