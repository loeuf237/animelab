name: Test native Android media bridge
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        required: true
        description: Build run containing native media test APKs
permissions:
  contents: read
  actions: read
jobs:
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Android-under-test
          path: android-validation
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: python scripts/android_instrumentation.py android-validation/AnimeLab-native-media-probe.apk android-validation/AnimeLab-native-media-tests.apk media-results --package com.animan.nativeprobe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native-Android-API-${{ matrix.api }}-media-results
          path: media-results/*
