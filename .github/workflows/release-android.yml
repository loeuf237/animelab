name: Release Android Python + Vue

on:
  push:
    tags: ['android-v0.*']
  workflow_call:
    inputs:
      tag_name:
        type: string
        required: true
      source_ref:
        type: string
        default: ''
      publish:
        type: boolean
        default: false
    secrets:
      ANIMAN_ANDROID_KEYSTORE_BASE64:
        required: true
      ANIMAN_ANDROID_STORE_PASSWORD:
        required: true
      ANIMAN_ANDROID_KEY_PASSWORD:
        required: true
      ANIMAN_ANDROID_KEY_ALIAS:
        required: true
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed Android beta after validation
        type: boolean
        default: false
      tag_name:
        description: Android release tag
        default: android-v0.1.6-beta.3
        required: true
      source_ref:
        description: Optional branch or SHA for a non-publishing test build
        default: ''
        required: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag_name }}
  SOURCE_REF: ${{ inputs.source_ref || (github.event_name == 'push' && github.ref_name || inputs.tag_name) }}

jobs:
  native-wheels:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Refuse publication from a test source override
        if: inputs.source_ref != '' && (inputs.publish || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo 'source_ref is only allowed for non-publishing test builds' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test native package validation
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          python -m pip install pytest
          python -m pytest -q tests/test_android_release.py tests/test_android_optimization.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: actions/cache@v4
        id: wheels
        with:
          path: android/wheels
          key: android-native-arm64-${{ hashFiles('scripts/android_native_wheels.py') }}
      - name: Build missing Android wheels
        if: steps.wheels.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf
          python scripts/android_native_wheels.py
      - uses: actions/upload-artifact@v4
        with:
          name: Android-native-wheels
          path: android/wheels/*.whl
          if-no-files-found: error

  build:
    needs: native-wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANIMAN_ANDROID_KEYSTORE: ${{ secrets.ANIMAN_ANDROID_KEYSTORE_BASE64 != '' && '/tmp/animan-release.p12' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build and test Vue
        working-directory: frontend
        run: npm ci && npm test && npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 platforms;android-36 build-tools;35.0.0
      - uses: actions/download-artifact@v4
        with:
          name: Android-native-wheels
          path: android/wheels
      - name: Restore signing identity when configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANIMAN_ANDROID_KEYSTORE_BASE64 }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          if os.environ.get('KEYSTORE_BASE64'):
              target = Path(os.environ['ANIMAN_ANDROID_KEYSTORE'])
              target.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'], validate=True))
              target.chmod(0o600)
          PY
      - name: Build installed test target and APK
        working-directory: android
        env:
          ANIMAN_ANDROID_STORE_PASSWORD: ${{ secrets.ANIMAN_ANDROID_STORE_PASSWORD }}
          ANIMAN_ANDROID_KEY_PASSWORD: ${{ secrets.ANIMAN_ANDROID_KEY_PASSWORD }}
          ANIMAN_ANDROID_KEY_ALIAS: ${{ secrets.ANIMAN_ANDROID_KEY_ALIAS }}
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm
          chmod +x gradlew
          runtime_flags=()
          if [[ "$RELEASE_TAG" == *-beta.* ]]; then
            runtime_flags+=(-Panimelab.experimentalApkRuntime=true)
            echo 'ANIMELAB_EXPERIMENTAL_APK_RUNTIME=true' >> "$GITHUB_ENV"
          else
            echo 'ANIMELAB_EXPERIMENTAL_APK_RUNTIME=false' >> "$GITHUB_ENV"
          fi
          if [ -n "$ANIMAN_ANDROID_KEYSTORE" ]; then
            ./gradlew :app:assembleRelease :app:assembleReleaseAndroidTest "${runtime_flags[@]}" --stacktrace
          else
            ./gradlew :app:assembleValidation :app:assembleValidationAndroidTest "${runtime_flags[@]}" --stacktrace
          fi
          ./gradlew :media-probe:assembleDebug :media-probe:assembleDebugAndroidTest --stacktrace
      - name: Inspect packaged engine and 16 KB native alignment
        run: |
          mkdir -p android-validation
          if [ -n "$ANIMAN_ANDROID_KEYSTORE" ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android-validation/AnimeLab-Android-under-test.apk
            cp android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk android-validation/AnimeLab-instrumentation.apk
            python scripts/android_release.py android-validation/AnimeLab-Android-under-test.apk android-validation --optimized
          else
            cp android/app/build/outputs/apk/validation/app-validation.apk android-validation/AnimeLab-Android-under-test.apk
            cp android/app/build/outputs/apk/androidTest/validation/app-validation-androidTest.apk android-validation/AnimeLab-instrumentation.apk
            python scripts/android_release.py android-validation/AnimeLab-Android-under-test.apk android-validation --validation --optimized
          fi
          cp android/media-probe/build/outputs/apk/debug/media-probe-debug.apk android-validation/AnimeLab-native-media-probe.apk
          cp android/media-probe/build/outputs/apk/androidTest/debug/media-probe-debug-androidTest.apk android-validation/AnimeLab-native-media-tests.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs android-validation/AnimeLab-Android-under-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 android-validation/AnimeLab-Android-under-test.apk
          python scripts/android_apk_size.py android-validation/AnimeLab-Android-under-test.apk --output android-validation/size
      - name: Verify production identity and record signing provenance
        if: env.ANIMAN_ANDROID_KEYSTORE != ''
        run: |
          python - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path
          root = Path('android-validation')
          expected = 'bdfde1d5b941680c8efb28f8692d894294762a9ad02292805457d5a82a3160b5'
          signer = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/apksigner'
          names = ['AnimeLab-Android-under-test.apk', 'AnimeLab-instrumentation.apk', 'Android-build-info.json']
          for name in names[:2]:
              cert = subprocess.check_output([str(signer), 'verify', '--print-certs', str(root / name)], text=True)
              if re.findall(r'certificate SHA-256 digest: ([a-f0-9]+)', cert) != [expected]:
                  raise RuntimeError('APK signing identity differs from existing installations')
          info = json.loads((root / names[2]).read_text())
          info.update(signing_certificate_sha256=expected, signing_method='github_actions', signing_private_key_uploaded=True)
          (root / names[2]).write_text(json.dumps(info, indent=2) + '\n')
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256((root / name).read_bytes()).hexdigest() + '  ' + name + '\n' for name in names))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Android-optimization-diagnostics
          path: |
            android/app/build/reports/native-optimization/
            android/app/build/outputs/mapping/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Android-under-test
          path: android-validation/*
          if-no-files-found: error
      - name: Remove temporary signing file
        if: always()
        run: rm -f /tmp/animan-release.p12

  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 30, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Android-under-test
          path: android-validation
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Emulator-only ADB access for collecting test evidence on API 30;
          # this does not grant extra storage privileges to the application.
          script: |
            adb root
            adb wait-for-device
            python scripts/android_run_probes.py android-validation android-test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-API-${{ matrix.api }}-test-results
          path: android-test-results/**

  prepare-release:
    needs: [build, device-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;35.0.0'
      - uses: actions/download-artifact@v4
        with:
          name: Android-under-test
          path: android-validation
      - name: Resolve the exact checked-out source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Require a production-signed, validated package
        run: |
          python scripts/android_publish.py android-validation release-assets \
            --build-tools "$ANDROID_HOME/build-tools/35.0.0" --tag "$RELEASE_TAG" \
            --source-commit "$SOURCE_COMMIT" --candidate-run-id "$GITHUB_RUN_ID" \
            --signing-method github_actions
      - uses: actions/upload-artifact@v4
        with:
          name: Android-release
          path: |
            release-assets/*.apk
            release-assets/Android-build-info.json
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/android-v') || inputs.publish
    needs: prepare-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REF }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: Android-release
          path: release-assets
      - name: Calculate standalone Android checksums
        run: |
          python - <<'PYTHON'
          import hashlib
          from pathlib import Path
          root = Path('release-assets')
          files = sorted(root.iterdir())
          (root / 'SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PYTHON
      - name: Publish standalone Android beta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --title "AnimeLab ${RELEASE_TAG#android-v} Android" --prerelease --notes-file "docs/releases/$RELEASE_TAG.md"
