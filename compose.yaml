name: animelab

services:
  animelab:
    image: animelab:local
    build:
      context: .
    init: true
    restart: unless-stopped
    stop_grace_period: 60s
    ports:
      - "${ANIMELAB_BIND_ADDRESS:-127.0.0.1}:${ANIMELAB_PORT:-8080}:8080"
    environment:
      ANIMAN_ALLOWED_HOSTS: "${ANIMAN_ALLOWED_HOSTS:-127.0.0.1,localhost}"
      ANIMAN_STARTUP_REFRESH: "${ANIMELAB_STARTUP_REFRESH:-true}"
      ANIMAN_LANGUAGE: "${ANIMELAB_LANGUAGE:-fr}"
    volumes:
      - data:/data
      - downloads:/downloads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
  downloads:
